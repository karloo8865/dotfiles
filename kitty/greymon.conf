# vim:ft=kitty

## name:     Greymon
## blurb:    Dark theme matching the greymon GTK/Qt palette

# The basic colors
foreground              #D2D3CE
background              #14171D
selection_foreground    #14171D
selection_background    #8A9FAD

# Cursor colors
cursor                  #8A9FAD
cursor_text_color       #14171D

# URL underline color when hovering with mouse
url_color               #8A9FAD

# Kitty window border colors
active_border_color     #8A9FAD
inactive_border_color   #596070
bell_border_color       #B0A883

# OS Window titlebar colors
